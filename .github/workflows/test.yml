name: Tork Governance SDK Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'tork_governance/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tork_governance/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run PII Detection Tests
        run: |
          pytest tests/test_pii_*.py -v --tb=short --junitxml=results/pii-tests.xml

      - name: Run Compliance Framework Tests
        run: |
          pytest tests/test_compliance_*.py -v --tb=short --junitxml=results/compliance-tests.xml

      - name: Run Industry Vertical Tests
        run: |
          pytest tests/test_industry_*.py -v --tb=short --junitxml=results/industry-tests.xml

      - name: Run Edge Cases & Integration Tests
        run: |
          pytest tests/test_edge_*.py -v --tb=short --junitxml=results/edge-tests.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: results/
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run Tests with Coverage
        run: |
          pytest tests/test_pii_*.py tests/test_compliance_*.py tests/test_industry_*.py tests/test_edge_*.py \
            --cov=tork_governance \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  compliance-matrix:
    name: Compliance Matrix Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate GDPR Compliance
        run: pytest tests/test_compliance_gdpr.py -v

      - name: Validate HIPAA Compliance
        run: pytest tests/test_compliance_hipaa.py -v

      - name: Validate PCI-DSS Compliance
        run: pytest tests/test_compliance_pci_dss.py -v

      - name: Validate SOC 2 Compliance
        run: pytest tests/test_compliance_soc2.py -v

      - name: Validate CCPA Compliance
        run: pytest tests/test_compliance_ccpa.py -v

      - name: Validate FERPA Compliance
        run: pytest tests/test_compliance_ferpa.py -v

      - name: Validate GLBA Compliance
        run: pytest tests/test_compliance_glba.py -v

      - name: Validate COPPA Compliance
        run: pytest tests/test_compliance_coppa.py -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, coverage, compliance-matrix]
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PII Detection (478 tests) | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Frameworks (238 tests) | ${{ needs.compliance-matrix.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Industry Verticals (33 tests) | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Cases (37 tests) | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage | ${{ needs.coverage.result == 'success' && '✅ Generated' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Tests: 786**" >> $GITHUB_STEP_SUMMARY
